<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Texas Art Project</title>
    <script language="javascript">
        // static hosts (GitHub Pages, our nginx dev container) serve this page for any missing path,
        // leaving the requested URL in place. redirect detail pages addressed by path, i.e.
        // /artwork/<id>/, to their query string equivalent, i.e. /artwork/?id=<id>
        (function() {
            let match = window.location.pathname.match(/^(.*)\/(artwork|ephemera-detail)\/([0-9a-f]{24})\/?$/)
            if (match) {
                let [, prefix, page, id] = match
                let params = new URLSearchParams(window.location.search)
                params.set('id', id)
                window.location.replace(`${prefix}/${page}/?${params.toString()}${window.location.hash}`)
            }
        })()
    </script>
    <!-- this page can be served at any depth, so paths here are root-absolute -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.typekit.net/qbi7knm.css">
    <link rel="stylesheet" href="/css/tap.css">
</head>
<body>
    <div id="tap-header-div"></div>

    <div class="container my-5">
        <h1>Page not found</h1>
        <p class="mt-3">Sorry, we couldn't find the page you were looking for. Try the <a href="/">home page</a> or the menu above.</p>
    </div>

    <div id="tap-footer-div"></div>

    <!-- JS INCLUDES -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/templates/global.js"></script>
    <script src="/js/corpora.js"></script>

    <!-- MAIN JS ENTRYPOINT -->
    <script language="javascript">
        window.rootPath = '/'

        // MAIN ENTRY POINT
        document.addEventListener('DOMContentLoaded', function() {
            prependToEl(getEl('tap-header-div'), siteHeaderTemplate({rootPath: window.rootPath}))
            appendToEl(getEl('tap-footer-div'), siteFooterTemplate({rootPath: window.rootPath}))
        })
    </script>
</body>
</html>
